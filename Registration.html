<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="#"method="post">
    
    <label>Full Name:</label>
    <input type="text"placeholder="Enter your name"> <br><br><br>
    
    <label>Email:</label>
    <input type="Email"name="Email"placeholder="xyz@gmail.com"> <br><br><br>
    
    <label>Password:</label>
    <input type="password"name="password"> <br><br><br>
    
    <label>Age:</label>
    <input type="text"placeholder="Enter your age"> <br><br><br>
    
    <label>Date of Birth:</label>
    <input type="Date"> <br><br><br>
    
    <p>Gender:</p>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name="gender" value="other"> Other <br><br><br>
    
    <label>City:</label> 
    <select name="city">
    <option value="dhaka">Dhaka</option>
    <option value="khulna">Khulna</option>
    <option value="rajshahi">Rajshahi</option>
    <option value="sylhet">Sylhet</option>
    </select>
    
    <p>Hobbies:</p>
    <input type="radio" name="Hobbies" value="Reading">Reading
    <input type="radio" name="Hobbies" value="Cricket">Cricket
    <input type="radio" name="Hobbies" value="Music">Music<br><br><br>
    
    <label>About Yourself:</label><br>
    <textarea name="About Yourself" rows="4" cols="40"></textarea><br><br><br>

    <input type="submit" value="Submit">
    <input type="submit" value="Reset">
    </form>
</body>
</html>
